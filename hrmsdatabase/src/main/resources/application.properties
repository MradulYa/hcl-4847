spring.application.name=hrmsdatabse
# ==========================================
# H2 Datasource Configuration
# ==========================================
spring.datasource.url=jdbc:h2:mem:abeshrms;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=hcl
spring.datasource.password=hcl

# Fixes random database name generations in newer Spring Boot versions
spring.h2.console.generate-unique-name=false

# ==========================================
# H2 Web Console Configuration
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true